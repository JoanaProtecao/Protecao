<!doctype html>
<html lang="pt-PT">
<head>
<title>Comparador de Seguros</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4fa834">
<meta name="description" content="Comparador de seguros DS Seguros: plano mínimo de cada seguradora para o perfil do cliente.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Comparador DS">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">

<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: ferramenta de balcão — barra de ramos no topo, perfil do cliente, depois uma ficha por seguradora ordenada por adequação */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --ink:#14233a; --muted:#5b6b82; --line:#d9e0ea;
  --accent:#2f7d1e; --accent-soft:#e4f2dc;
  --ok:#1f7a3f; --ok-soft:#e2f3e8; --opc:#8a5a00; --opc-soft:#fbefd5; --conf:#3b4f9a; --conf-soft:#e5e9f8; --no:#8f2d2d; --no-soft:#f6e3e3;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1622; --surface:#172131; --ink:#e6ecf5; --muted:#9aa8bd; --line:#2a3850;
  --accent:#7fcf5f; --accent-soft:#1d3317;
  --ok:#6fd38f; --ok-soft:#173523; --opc:#f0c060; --opc-soft:#3a2e12; --conf:#9fb1f5; --conf-soft:#1f2848; --no:#f09a9a; --no-soft:#3d1c1c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1622; --surface:#172131; --ink:#e6ecf5; --muted:#9aa8bd; --line:#2a3850;
  --accent:#7fcf5f; --accent-soft:#1d3317;
  --ok:#6fd38f; --ok-soft:#173523; --opc:#f0c060; --opc-soft:#3a2e12; --conf:#9fb1f5; --conf-soft:#1f2848; --no:#f09a9a; --no-soft:#3d1c1c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:16px 48px}
header{display:flex;align-items:center;gap:12px;padding-block:8px 16px}
.mark{width:44px;height:44px;border-radius:8px;flex:none;display:block}
h1{font-family:var(--display);font-weight:800;font-size:22px;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin:0}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:2;padding-top:6px}
nav button{font:600 14px var(--body);color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px;white-space:nowrap;cursor:pointer}
nav button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
nav button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:14px}
.panel h2{font-family:var(--display);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
input[type=number],select{font:500 15px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
.checks{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chk{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;background:var(--bg)}
.chk:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.chk input{accent-color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin:16px 2px 8px}
.results{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.card.no{opacity:.72}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.ins{font-family:var(--display);font-weight:700;font-size:17px}
.prod{color:var(--muted);font-size:13px}
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.opc{background:var(--opc-soft);color:var(--opc)}
.pill.conf{background:var(--conf-soft);color:var(--conf)}.pill.no{background:var(--no-soft);color:var(--no)}
.plan{font-weight:600}
.plan span{font-weight:400;color:var(--muted)}
ul.facts{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:2px;font-size:14px}
.notes{font-size:13px;color:var(--opc)}
.src{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.src a{color:var(--accent)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
details.more{margin-top:6px}
details.more summary{cursor:pointer;color:var(--muted);font-size:14px;padding:6px 2px}
.todo h3{font-family:var(--display);font-size:16px;margin:0 0 6px}
.todo ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.todo .panel{display:flex;flex-direction:column;gap:6px}
.foot{margin-top:24px;font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.card{transition:opacity .15s}}
</style>

</head>

function evalVida(p,c){
  const notes=[...p.notes];
  if(c.idade && p.entryMax && c.idade>p.entryMax) return {s:'no',why:`Entrada só até aos ${p.entryMax} anos`,notes};
  if(c.idade && !p.entryMax) notes.unshift('Confirmar se aceita '+c.idade+' anos');
  for(const pl of p.plans){
    const itp=pl.inv.find(i=>i.t==='ITP');
    let invOk;
    if(c.inv==='iad') invOk=true;
    else { invOk=!!itp && (itp.pct===null || itp.pct.some(x=>x<=c.pct)); }
    if(!invOk) continue;
    if(c.dg && !pl.dg) continue;
    if(c.exon && !pl.exon) continue;
    const opt=(c.dg&&pl.dg==='opc')||(c.exon&&pl.exon==='opc');
    const n=[...notes];
    if(c.inv==='itp' && itp){
      if(itp.pct===null) n.unshift('Grau da ITP não confirmado');
      if(itp.termo && c.idade && c.idade>=itp.termo) n.unshift(`A ITP termina aos ${itp.termo}: na idade do cliente já não se aplica`);
    }
    const facts=[...pl.x];
    pl.inv.forEach(i=>facts.push(i.t==='ITP'?`ITP/IDPAC ${i.pct?i.pct.join('% / ')+'%':'(grau ?)'}${i.termo?' · até aos '+i.termo:''}`:`IAD${i.termo?' · até aos '+i.termo:''}`));
    if(p.entryMax) facts.push('Entrada até aos '+p.entryMax+' anos');
    return {s:p.partial?'conf':opt?'opc':'ok',plan:pl.n,facts:[...new Set(facts)],notes:n};
  }
  return {s:'no',why:c.inv==='itp'?'Não tem ITP/IDPAC com esse grau':'Não tem a cobertura pedida',notes};
}

   x:['Vidros 500 € a 2.500 €','DP Extra inclui bagagem até 1.000 €','Privação de uso opcional (15 ou 30 dias)']}
];
function evalPlans(p,need,get){
  let opt=null,unk=null;
  for(const pl of p.plans){
    const v=need.map(k=>get(pl,k));
    if(v.every(x=>x==='inc')) return {s:'ok',plan:pl.n};
    if(!opt && v.every(x=>x==='inc'||x==='opc')) opt=pl;
    if(!unk && v.every(x=>x==='inc'||x==='opc'||x==='?')) unk=pl;
  }
  if(opt) return {s:'opc',plan:opt.n,extra:need.filter(k=>get(opt,k)==='opc')};
  if(unk) return {s:'conf',plan:unk.n,unk:need.filter(k=>get(unk,k)==='?')};
  return {s:'no'};
}
function evalAuto(p,c){
  const need=Object.keys(AUTO_K).filter(k=>c[k]);
  const r=evalPlans(p,need,(pl,k)=>pl.c[k]||null);
  const notes=[...(p.notes||[])];
  if(p.old) notes.push('Documento antigo ('+p.data+'): confirmar se ainda está em vigor');
  if(r.extra) notes.unshift('Acrescentar: '+r.extra.map(k=>AUTO_K[k]).join(', '));
  if(r.unk) notes.unshift('Por confirmar: '+r.unk.map(k=>AUTO_K[k]).join(', '));
  if(r.s==='no') return {s:'no',why:'Nenhum plano cobre tudo o que foi pedido',notes};
  if(r.s==='ok' && p.old) r.s='conf';
  return {s:r.s,plan:r.plan,facts:p.x,notes};
}

    return {s:p.partial||p.old?'conf':opt?'opc':'ok',plan:pl.n,facts:[...facts,...pl.x,...p.x],notes};

}

const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let cur=store.get('cs-tab','vida');
const crit={};RAMOS.forEach(r=>{if(r.def)crit[r.id]=store.get('cs-'+r.id,r.def)});

function tabs(){
  document.getElementById('tabs').innerHTML=RAMOS.map(r=>`<button role="tab" aria-selected="${r.id===cur}" data-id="${r.id}">${r.nome}</button>`).join('');
}
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;cur=b.dataset.id;store.set('cs-tab',cur);tabs();view()});

function card(p,r){
  const pills=`<span class="pill ${r.s}">${ST[r.s]}</span>`;
  return `<article class="card ${r.s==='no'?'no':''}">
   <div class="top"><div><div class="ins">${p.ins}${p.rare?' <span class="prod">· pouco usada</span>':''}</div><div class="prod">${p.prod}</div></div>${pills}</div>
   ${r.plan?`<div class="plan">${r.plan} <span>· plano mínimo que cumpre</span></div>`:`<div class="plan"><span>${r.why}</span></div>`}
   ${r.facts&&r.facts.length?`<ul class="facts">${r.facts.map(f=>`<li>${f}</li>`).join('')}</ul>`:''}
   ${r.notes&&r.notes.length?`<div class="notes">${r.notes.join(' · ')}</div>`:''}
   <div class="src"><span>Fonte: ${p.data}</span><a href="${p.url}" target="_blank" rel="noopener">Abrir fonte</a></div>
  </article>`;
}
function results(R){
  const c=crit[R.id];const order={ok:0,opc:1,conf:2,no:3};
  const rows=R.data.map(p=>({p,r:R.ev(p,c)})).sort((a,b)=>order[a.r.s]-order[b.r.s]);
  const yes=rows.filter(x=>x.r.s!=='no'),no=rows.filter(x=>x.r.s==='no');
  return `<div class="legend"><span><b>${yes.length}</b> de ${rows.length} seguradoras servem este cliente</span></div>
   <div class="results">${yes.map(x=>card(x.p,x.r)).join('')||'<div class="card">Nenhuma seguradora cumpre. Experimente baixar os requisitos.</div>'}</div>
   ${no.length?`<details class="more"><summary>Não cumprem (${no.length})</summary><div class="results">${no.map(x=>card(x.p,x.r)).join('')}</div></details>`:''}`;
}
function view(){
  const v=document.getElementById('view');const R=RAMOS.find(r=>r.id===cur);
  if(R.id==='falta'){
    v.innerHTML=`<div class="todo"><div class="panel"><h2>Para trazer da agência</h2><p class="sub" style="margin:0">Enviar no chat; os dados são atualizados na app.</p></div>${TODO.map(g=>`<div class="panel"><h3>${g.t}</h3><ul>${g.i.map(i=>`<li>${i}</li>`).join('')}</ul></div>`).join('')}</div>`;
    return;
  }
  v.innerHTML=`<section class="panel" id="form-${R.id}"><h2>Perfil do cliente</h2>${R.form(crit[R.id])}</section><section id="res">${results(R)}</section>`;
  document.getElementById('form-'+R.id).addEventListener('input',()=>{crit[R.id]=R.read();store.set('cs-'+R.id,crit[R.id]);document.getElementById('res').innerHTML=results(R)});
}
tabs();view();
</script>

<script>
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
</body>
</html>
